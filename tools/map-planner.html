<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>맵 기획 그리드 툴</title>
<style>
  :root{
    --bg:#1e2126; --panel:#262a31; --panel2:#2d323b; --border:#3a404b;
    --text:#e6e9ee; --dim:#9aa3b0; --accent:#4da3ff; --danger:#ff6b6b;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Segoe UI','Malgun Gothic',sans-serif; background:var(--bg); color:var(--text);
    display:flex; flex-direction:column; overflow:hidden; font-size:13px;
  }
  button{font-family:inherit; font-size:12px; color:var(--text); background:var(--panel2);
    border:1px solid var(--border); border-radius:4px; padding:4px 8px; cursor:pointer;}
  button:hover{background:#363c47;}
  button.primary{background:var(--accent); border-color:var(--accent); color:#10141a; font-weight:600;}
  button.primary:hover{background:#6cb4ff;}
  input,select{font-family:inherit; font-size:12px; color:var(--text); background:var(--bg);
    border:1px solid var(--border); border-radius:4px; padding:3px 6px;}
  input[type=color]{padding:0; width:26px; height:22px; cursor:pointer;}
  input[type=number]{width:52px;}
  label{color:var(--dim);}

  /* ── 헤더 ── */
  #topbar{display:flex; align-items:center; gap:10px; padding:8px 12px;
    background:var(--panel); border-bottom:1px solid var(--border); flex:none;}
  #topbar h1{font-size:14px; font-weight:700; margin-right:4px; white-space:nowrap;}
  #topbar .spacer{flex:1;}
  #projName{width:180px; font-weight:600;}

  /* ── 본문 레이아웃 ── */
  #main{display:flex; flex:1; min-height:0;}
  #sidebar{width:250px; flex:none; background:var(--panel); border-right:1px solid var(--border);
    display:flex; flex-direction:column; overflow-y:auto;}
  .section{padding:10px 12px; border-bottom:1px solid var(--border);}
  .section h2{font-size:11px; font-weight:700; color:var(--dim); text-transform:uppercase;
    letter-spacing:.06em; margin-bottom:8px; display:flex; align-items:center; justify-content:space-between;}
  .section h2 button{padding:1px 7px; font-size:13px; line-height:1.2;}

  /* 시트 목록 */
  .sheet-item{display:flex; align-items:center; gap:6px; padding:4px 6px; border-radius:4px;
    cursor:pointer; user-select:none;}
  .sheet-item:hover{background:var(--panel2);}
  .sheet-item.active{background:#31415a; outline:1px solid var(--accent);}
  .sheet-item .nm{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .sheet-item .sz{color:var(--dim); font-size:11px;}
  .sheet-item .ops{display:none; gap:2px;}
  .sheet-item:hover .ops{display:flex;}
  .sheet-item .ops button{padding:0 4px; font-size:11px;}

  /* 파츠 팔레트 */
  .part-item{display:flex; align-items:center; gap:6px; padding:3px 6px; border-radius:4px;
    cursor:pointer; user-select:none;}
  .part-item:hover{background:var(--panel2);}
  .part-item.active{background:#31415a; outline:1px solid var(--accent);}
  .part-item .sw{width:16px; height:16px; border-radius:3px; border:1px solid rgba(255,255,255,.25); flex:none;}
  .part-item .thumb{width:22px; height:22px; border-radius:3px; object-fit:cover; flex:none;
    border:1px solid var(--border);}
  .part-item .nm{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .part-item .cnt{color:var(--dim); font-size:11px;}
  .part-item .pf{font-size:10px; color:#ffd166;}
  .part-item .ops{display:none; gap:2px;}
  .part-item:hover .ops{display:flex;}
  .part-item .ops button{padding:0 4px; font-size:11px;}
  #eraserItem .sw{background:
    repeating-conic-gradient(#555 0 25%, #888 0 50%) 0 0/8px 8px;}

  /* 도구 */
  #tools{display:flex; flex-wrap:wrap; gap:4px;}
  #tools button{flex:1 1 30%; padding:6px 2px;}
  #tools button.active{background:var(--accent); border-color:var(--accent); color:#10141a; font-weight:700;}

  /* 캔버스 영역 */
  #canvasWrap{flex:1; display:flex; flex-direction:column; min-width:0;}
  #canvasScroll{flex:1; overflow:auto; background:#181b1f;}
  #canvasScroll canvas{display:block; margin:24px; image-rendering:pixelated; cursor:crosshair;}
  #statusbar{flex:none; display:flex; gap:16px; align-items:center; padding:5px 12px;
    background:var(--panel); border-top:1px solid var(--border); color:var(--dim); font-size:12px;}
  #statusbar .spacer{flex:1;}

  /* 다이얼로그 */
  dialog{background:var(--panel); color:var(--text); border:1px solid var(--border);
    border-radius:8px; padding:16px; min-width:300px;
    margin:auto; position:fixed; inset:0;}
  dialog::backdrop{background:rgba(0,0,0,.5);}
  dialog h3{font-size:14px; margin-bottom:12px;}
  dialog .row{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  dialog .row label{width:80px; flex:none;}
  dialog .row input[type=text], dialog .row textarea{flex:1;}
  dialog .row textarea{font-family:inherit; font-size:12px; color:var(--text); background:var(--bg);
    border:1px solid var(--border); border-radius:4px; padding:4px 6px; resize:vertical; min-height:44px;}
  dialog .btns{display:flex; justify-content:flex-end; gap:6px; margin-top:12px;}
  #pImgDrop{flex:1; min-height:70px; border:1px dashed var(--border); border-radius:6px;
    display:flex; align-items:center; justify-content:center; gap:8px; color:var(--dim);
    cursor:pointer; overflow:hidden; position:relative;}
  #pImgDrop.has img{max-width:100%; max-height:130px; display:block;}
  #pImgDrop .rm{position:absolute; top:4px; right:4px; display:none;}
  #pImgDrop.has .rm{display:block;}

  .hint{color:var(--dim); font-size:11px; line-height:1.5; margin-top:6px;}
</style>
</head>
<body>

<div id="topbar">
  <h1>🗺️ 맵 기획 그리드 툴</h1>
  <input id="projName" type="text" placeholder="맵 이름 (예: 경복궁)">
  <label>셀 크기 <input id="cellMeters" type="number" min="0.1" step="0.5" value="1" style="width:56px"> m</label>
  <div class="spacer"></div>
  <button id="btnUndo" title="Ctrl+Z">↩ 실행취소</button>
  <button id="btnRedo" title="Ctrl+Y">↪ 다시실행</button>
  <button id="btnExportJson">💾 저장(JSON)</button>
  <button id="btnImportJson">📂 불러오기</button>
  <button id="btnExportPng" class="primary">🖼️ 이미지 내보내기</button>
  <button id="btnExportAllPng">🖼️ 전체 시트</button>
  <button id="btnExportVarco" title="파츠 이미지+메모+프롬프트만 모은 JSON — 클로드에게 주면 바르코 생성 자동화">📦 바르코 핸드오프</button>
</div>

<div id="main">
  <div id="sidebar">
    <div class="section">
      <h2>시트 (층 / 뷰) <button id="btnAddSheet" title="시트 추가">＋</button></h2>
      <div id="sheetList"></div>
      <div class="hint">더블클릭: 이름/크기 수정 · ⧉ 복제(층 쌓기용) · ✕ 삭제</div>
    </div>
    <div class="section">
      <h2>파츠 <button id="btnAddPart" title="파츠 추가">＋</button></h2>
      <div class="part-item" id="eraserItem"><div class="sw"></div><div class="nm">지우개</div></div>
      <div id="partList"></div>
      <div class="hint">숫자키 1~9로 빠른 선택 · 더블클릭: 수정 · ✕ 삭제<br>★ = 공정 파츠 · 수정창에서 레퍼런스 이미지 첨부</div>
    </div>
    <div class="section">
      <h2>도구</h2>
      <div id="tools">
        <button data-tool="pen"  title="B">✏️ 펜</button>
        <button data-tool="rect" title="R">▭ 사각형</button>
        <button data-tool="fill" title="G">🪣 채우기</button>
        <button data-tool="line" title="L">╱ 직선</button>
        <button data-tool="pick" title="I">💉 스포이드</button>
      </div>
      <div class="hint">우클릭 드래그 = 지우개 · Shift+펜 = 직선</div>
    </div>
    <div class="section">
      <h2>보기</h2>
      <div class="row" style="display:flex;align-items:center;gap:8px;">
        <label>줌</label>
        <input id="zoom" type="range" min="8" max="48" value="22" style="flex:1">
      </div>
    </div>
  </div>

  <div id="canvasWrap">
    <div id="canvasScroll"><canvas id="cv"></canvas></div>
    <div id="statusbar">
      <span id="stCoord">–</span>
      <span id="stSheet"></span>
      <span class="spacer"></span>
      <span id="stSaved"></span>
    </div>
  </div>
</div>

<!-- 파츠 편집 다이얼로그 -->
<dialog id="dlgPart">
  <h3 id="dlgPartTitle">파츠 추가</h3>
  <div class="row"><label>이름</label><input id="pName" type="text" placeholder="예: 근정전 기둥"></div>
  <div class="row"><label>색상</label><input id="pColor" type="color" value="#4da3ff">
    <div id="presetColors" style="display:flex;gap:4px;flex-wrap:wrap;"></div></div>
  <div class="row"><label>공정 여부</label><input id="pPrefab" type="checkbox"> <span style="color:var(--dim)">체크 = 플레이어가 건축하는 파츠</span></div>
  <div class="row"><label>메모</label><input id="pMemo" type="text" placeholder="크기·비율 등 (예: 4×4×6m)"></div>
  <div class="row" style="align-items:flex-start;"><label style="padding-top:4px">레퍼런스</label>
    <div id="pImgDrop" title="클릭해서 선택하거나, 이미지를 드래그/붙여넣기(Ctrl+V)">
      <span class="ph">📷 클릭 · 드래그 · Ctrl+V</span>
      <button class="rm" title="이미지 제거">✕</button>
    </div>
  </div>
  <div class="row" style="align-items:flex-start;"><label style="padding-top:4px">VARCO 프롬프트</label>
    <textarea id="pPrompt" placeholder="비워두면 나중에 클로드가 레퍼런스+메모 보고 자동 생성"></textarea>
  </div>
  <div class="btns">
    <button id="pDelete" style="margin-right:auto;color:var(--danger)">삭제</button>
    <button id="pCancel">취소</button>
    <button id="pOk" class="primary">확인</button>
  </div>
</dialog>

<!-- 시트 편집 다이얼로그 -->
<dialog id="dlgSheet">
  <h3 id="dlgSheetTitle">시트 추가</h3>
  <div class="row"><label>이름</label><input id="sName" type="text" placeholder="예: 1층 / 정면도"></div>
  <div class="row"><label>가로 칸수</label><input id="sW" type="number" min="1" max="200" value="30"></div>
  <div class="row"><label>세로 칸수</label><input id="sH" type="number" min="1" max="200" value="20"></div>
  <div class="hint" id="sSizeHint"></div>
  <div class="btns">
    <button id="sDelete" style="margin-right:auto;color:var(--danger)">삭제</button>
    <button id="sCancel">취소</button>
    <button id="sOk" class="primary">확인</button>
  </div>
</dialog>

<input type="file" id="fileInput" accept=".json" style="display:none">

<script>
'use strict';
/* ───────────────────────── 상태 ───────────────────────── */
const LS_KEY = 'mapPlanner.v1';
let state = null;          // {name, cellMeters, partSeq, parts:[], sheets:[], activeSheet}
let activePartId = 0;      // 0 = 지우개
let tool = 'pen';
let cellPx = 22;
const MARGIN = 26;         // 좌표 라벨 여백(px)

let undoStack = [], redoStack = [];
const UNDO_MAX = 60;

function defaultState(){
  return {
    name: '',
    cellMeters: 1,
    partSeq: 1,
    parts: [],   // {id, name, color, prefab, memo}
    sheets: [ mkSheet('1층', 30, 20) ],
    activeSheet: 0,
  };
}
function mkSheet(name, w, h){
  return { name, w, h, cells: new Array(w*h).fill(0) };
}
function curSheet(){ return state.sheets[state.activeSheet]; }
function partById(id){ return state.parts.find(p => p.id === id); }

/* ───────────────────────── 저장/불러오기 ───────────────────────── */
let saveTimer = null;
function markDirty(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    localStorage.setItem(LS_KEY, JSON.stringify(state));
    document.getElementById('stSaved').textContent =
      '자동저장됨 ' + new Date().toLocaleTimeString('ko-KR');
  }, 400);
}
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ state = JSON.parse(raw); return; }
  }catch(e){ console.warn(e); }
  state = defaultState();
}

/* ───────────────────────── 실행취소 ───────────────────────── */
function pushUndo(){
  undoStack.push(JSON.stringify(state));
  if(undoStack.length > UNDO_MAX) undoStack.shift();
  redoStack.length = 0;
}
function undo(){
  if(!undoStack.length) return;
  redoStack.push(JSON.stringify(state));
  state = JSON.parse(undoStack.pop());
  afterStateSwap();
}
function redo(){
  if(!redoStack.length) return;
  undoStack.push(JSON.stringify(state));
  state = JSON.parse(redoStack.pop());
  afterStateSwap();
}
function afterStateSwap(){
  if(state.activeSheet >= state.sheets.length) state.activeSheet = 0;
  if(activePartId !== 0 && !partById(activePartId)) activePartId = 0;
  renderAll(); markDirty();
}

/* ───────────────────────── 캔버스 렌더 ───────────────────────── */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

function renderCanvas(){
  const s = curSheet();
  cv.width  = MARGIN + s.w * cellPx + 1;
  cv.height = MARGIN + s.h * cellPx + 1;
  drawSheet(ctx, s, cellPx, MARGIN, true);
  if(preview) drawPreview();
  document.getElementById('stSheet').textContent =
    `${s.name} · ${s.w}×${s.h}칸 (${fmt(s.w*state.cellMeters)}×${fmt(s.h*state.cellMeters)}m)`;
}
function fmt(n){ return Math.round(n*100)/100; }

// 공용 시트 드로잉 (화면 + PNG 내보내기 겸용)
function drawSheet(g, s, px, margin, screen){
  const W = margin + s.w*px + 1, H = margin + s.h*px + 1;
  g.fillStyle = screen ? '#20242a' : '#ffffff';
  g.fillRect(0, 0, W, H);

  // 셀
  for(let y=0; y<s.h; y++){
    for(let x=0; x<s.w; x++){
      const id = s.cells[y*s.w + x];
      if(!id) continue;
      const p = partById(id);
      if(!p) continue;
      g.fillStyle = p.color;
      g.fillRect(margin + x*px, margin + y*px, px, px);
    }
  }
  // 격자
  g.strokeStyle = screen ? 'rgba(255,255,255,.13)' : 'rgba(0,0,0,.18)';
  g.lineWidth = 1;
  g.beginPath();
  for(let x=0; x<=s.w; x++){
    const gx = margin + x*px + .5;
    g.moveTo(gx, margin); g.lineTo(gx, margin + s.h*px);
  }
  for(let y=0; y<=s.h; y++){
    const gy = margin + y*px + .5;
    g.moveTo(margin, gy); g.lineTo(margin + s.w*px, gy);
  }
  g.stroke();
  // 5칸 굵은선
  g.strokeStyle = screen ? 'rgba(255,255,255,.28)' : 'rgba(0,0,0,.4)';
  g.beginPath();
  for(let x=0; x<=s.w; x+=5){
    const gx = margin + x*px + .5;
    g.moveTo(gx, margin); g.lineTo(gx, margin + s.h*px);
  }
  for(let y=0; y<=s.h; y+=5){
    const gy = margin + y*px + .5;
    g.moveTo(margin, gy); g.lineTo(margin + s.w*px, gy);
  }
  g.stroke();
  // 좌표 라벨 (5칸마다)
  g.fillStyle = screen ? '#8b93a0' : '#555';
  g.font = `${Math.max(9, Math.min(12, px*0.5))}px "Segoe UI", sans-serif`;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  for(let x=0; x<=s.w; x+=5)
    g.fillText(x, margin + x*px, margin*0.45);
  for(let y=0; y<=s.h; y+=5){
    g.textAlign = 'right';
    g.fillText(y, margin*0.8, margin + y*px);
    g.textAlign = 'center';
  }
}

/* 미리보기(사각형/직선 드래그 중) */
let preview = null;   // {cells:Set<idx>, partId}
function drawPreview(){
  const s = curSheet();
  ctx.save();
  ctx.globalAlpha = .55;
  const p = preview.partId ? partById(preview.partId) : null;
  ctx.fillStyle = p ? p.color : '#ffffff';
  for(const idx of preview.cells){
    const x = idx % s.w, y = (idx / s.w)|0;
    ctx.fillRect(MARGIN + x*cellPx, MARGIN + y*cellPx, cellPx, cellPx);
  }
  ctx.restore();
}

/* ───────────────────────── 편집 로직 ───────────────────────── */
function cellFromEvent(e){
  const r = cv.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left - MARGIN) / cellPx);
  const y = Math.floor((e.clientY - r.top  - MARGIN) / cellPx);
  const s = curSheet();
  if(x < 0 || y < 0 || x >= s.w || y >= s.h) return null;
  return {x, y, idx: y*s.w + x};
}
function setCell(idx, id){
  curSheet().cells[idx] = id;
}
function lineCells(x0,y0,x1,y1){
  // Bresenham
  const out = [];
  const s = curSheet();
  let dx = Math.abs(x1-x0), dy = -Math.abs(y1-y0);
  let sx = x0<x1?1:-1, sy = y0<y1?1:-1, err = dx+dy;
  while(true){
    out.push(y0*s.w + x0);
    if(x0===x1 && y0===y1) break;
    const e2 = 2*err;
    if(e2 >= dy){ err += dy; x0 += sx; }
    if(e2 <= dx){ err += dx; y0 += sy; }
  }
  return out;
}
function rectCells(x0,y0,x1,y1){
  const s = curSheet();
  const out = [];
  const xa = Math.min(x0,x1), xb = Math.max(x0,x1);
  const ya = Math.min(y0,y1), yb = Math.max(y0,y1);
  for(let y=ya; y<=yb; y++) for(let x=xa; x<=xb; x++) out.push(y*s.w + x);
  return out;
}
function floodFill(idx, id){
  const s = curSheet();
  const target = s.cells[idx];
  if(target === id) return;
  const q = [idx];
  while(q.length){
    const i = q.pop();
    if(s.cells[i] !== target) continue;
    s.cells[i] = id;
    const x = i % s.w, y = (i / s.w)|0;
    if(x > 0)      q.push(i-1);
    if(x < s.w-1)  q.push(i+1);
    if(y > 0)      q.push(i-s.w);
    if(y < s.h-1)  q.push(i+s.w);
  }
}

let dragging = false, dragBtn = 0, dragStart = null, lastCell = null, undoPushed = false;

cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('pointerdown', e => {
  const c = cellFromEvent(e);
  if(!c) return;
  cv.setPointerCapture(e.pointerId);
  dragging = true; dragBtn = e.button; dragStart = c; lastCell = c; undoPushed = false;

  const paintId = (e.button === 2) ? 0 : activePartId;

  if(tool === 'pick'){
    const id = curSheet().cells[c.idx];
    activePartId = id;
    renderSidebar();
    dragging = false;
    return;
  }
  if(tool === 'fill'){
    pushUndo();
    floodFill(c.idx, paintId);
    dragging = false;
    renderAll(); markDirty();
    return;
  }
  if(tool === 'pen' && !e.shiftKey){
    pushUndo(); undoPushed = true;
    setCell(c.idx, paintId);
    renderCanvas(); markDirty();
    return;
  }
  // rect / line / shift+pen → 미리보기 모드
  preview = { cells: new Set([c.idx]), partId: paintId };
  renderCanvas();
});
cv.addEventListener('pointermove', e => {
  const c = cellFromEvent(e);
  document.getElementById('stCoord').textContent = c
    ? `x:${c.x}, y:${c.y}  (${fmt(c.x*state.cellMeters)}m, ${fmt(c.y*state.cellMeters)}m)` : '–';
  if(!dragging || !c) return;

  const paintId = (dragBtn === 2) ? 0 : activePartId;
  if(tool === 'pen' && !preview){
    if(lastCell && (lastCell.x !== c.x || lastCell.y !== c.y)){
      for(const i of lineCells(lastCell.x, lastCell.y, c.x, c.y)) setCell(i, paintId);
      lastCell = c;
      renderCanvas(); markDirty();
    }
    return;
  }
  if(preview){
    const cells = (tool === 'rect')
      ? rectCells(dragStart.x, dragStart.y, c.x, c.y)
      : lineCells(dragStart.x, dragStart.y, c.x, c.y);
    preview.cells = new Set(cells);
    lastCell = c;
    renderCanvas();
  }
});
cv.addEventListener('pointerup', e => {
  if(!dragging) return;
  dragging = false;
  if(preview){
    pushUndo();
    for(const i of preview.cells) setCell(i, preview.partId);
    preview = null;
    renderAll(); markDirty();
  }
});

/* ───────────────────────── 사이드바 ───────────────────────── */
function renderSidebar(){ renderSheetList(); renderPartList(); renderTools(); }

function renderSheetList(){
  const el = document.getElementById('sheetList');
  el.innerHTML = '';
  state.sheets.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'sheet-item' + (i === state.activeSheet ? ' active' : '');
    const canDelete = state.sheets.length > 1;
    div.innerHTML = `<span class="nm"></span><span class="sz">${s.w}×${s.h}</span>
      <span class="ops"><button class="dup" title="복제">⧉</button>${canDelete ? '<button class="del" title="삭제">✕</button>' : ''}</span>`;
    div.querySelector('.nm').textContent = s.name;
    div.addEventListener('click', () => { state.activeSheet = i; renderAll(); markDirty(); });
    div.addEventListener('dblclick', () => openSheetDialog(i));
    div.querySelector('.dup').addEventListener('click', ev => {
      ev.stopPropagation();
      pushUndo();
      const copy = JSON.parse(JSON.stringify(s));
      copy.name = s.name + ' 복사';
      state.sheets.splice(i+1, 0, copy);
      state.activeSheet = i+1;
      renderAll(); markDirty();
    });
    if(canDelete) div.querySelector('.del').addEventListener('click', ev => {
      ev.stopPropagation();
      if(!confirm(`시트 "${s.name}"을(를) 삭제할까요?`)) return;
      pushUndo();
      state.sheets.splice(i, 1);
      if(state.activeSheet >= state.sheets.length) state.activeSheet = state.sheets.length - 1;
      else if(state.activeSheet > i) state.activeSheet--;
      renderAll(); markDirty();
    });
    el.appendChild(div);
  });
}

const PRESETS = ['#e05252','#e8873a','#ffd166','#7ac74f','#35b39a','#4da3ff','#7d6bff','#d16bd1',
                 '#a0522d','#8d99ae','#c8b8a0','#5c6b73'];
function renderPartList(){
  const el = document.getElementById('partList');
  el.innerHTML = '';
  const s = curSheet();
  const counts = {};
  for(const id of s.cells) if(id) counts[id] = (counts[id]||0) + 1;

  document.getElementById('eraserItem').className =
    'part-item' + (activePartId === 0 ? ' active' : '');

  state.parts.forEach((p, i) => {
    const div = document.createElement('div');
    div.className = 'part-item' + (p.id === activePartId ? ' active' : '');
    div.innerHTML = `<div class="sw"></div>${p.img ? '<img class="thumb">' : ''}<span class="nm"></span>
      ${p.prefab ? '<span class="pf">★</span>' : ''}
      <span class="cnt">${counts[p.id]||0}</span>
      <span class="ops"><button class="del" title="삭제">✕</button></span>`;
    div.querySelector('.sw').style.background = p.color;
    if(p.img) div.querySelector('.thumb').src = p.img;
    div.querySelector('.nm').textContent = (i<9 ? (i+1)+'. ' : '') + p.name;
    div.title = p.memo || '';
    div.addEventListener('click', () => { activePartId = p.id; renderPartList(); });
    div.addEventListener('dblclick', () => openPartDialog(p.id));
    div.querySelector('.del').addEventListener('click', ev => {
      ev.stopPropagation();
      deletePart(p.id);
    });
    el.appendChild(div);
  });
}
document.getElementById('eraserItem').addEventListener('click', () => {
  activePartId = 0; renderPartList();
});

function renderTools(){
  document.querySelectorAll('#tools button').forEach(b =>
    b.classList.toggle('active', b.dataset.tool === tool));
}
document.querySelectorAll('#tools button').forEach(b =>
  b.addEventListener('click', () => { tool = b.dataset.tool; renderTools(); }));

/* ───────────────────────── 파츠 다이얼로그 ───────────────────────── */
const dlgPart = document.getElementById('dlgPart');
let editPartId = null;   // null = 새 파츠

const presetWrap = document.getElementById('presetColors');
PRESETS.forEach(c => {
  const b = document.createElement('button');
  b.style.cssText = `width:18px;height:18px;padding:0;background:${c};border-radius:3px;`;
  b.addEventListener('click', ev => { ev.preventDefault(); document.getElementById('pColor').value = c; });
  presetWrap.appendChild(b);
});

/* 파츠 레퍼런스 이미지 */
let dlgImg = null;   // 편집 중인 이미지(dataURL)
const imgDrop = document.getElementById('pImgDrop');
const imgFileInput = document.createElement('input');
imgFileInput.type = 'file'; imgFileInput.accept = 'image/*';

function setDlgImg(dataUrl){
  dlgImg = dataUrl;
  imgDrop.classList.toggle('has', !!dataUrl);
  imgDrop.querySelector('.ph').style.display = dataUrl ? 'none' : '';
  let im = imgDrop.querySelector('img.pv');
  if(dataUrl){
    if(!im){ im = document.createElement('img'); im.className = 'pv'; imgDrop.prepend(im); }
    im.src = dataUrl;
  }else if(im) im.remove();
}
// 긴 변 640px로 축소해 JPEG 저장 (localStorage 용량 보호)
function importImageFile(file){
  if(!file || !file.type.startsWith('image/')) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    const MAXD = 640;
    const scale = Math.min(1, MAXD / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * scale);
    c.height = Math.round(img.height * scale);
    const g = c.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
    g.drawImage(img, 0, 0, c.width, c.height);
    setDlgImg(c.toDataURL('image/jpeg', 0.85));
    URL.revokeObjectURL(url);
  };
  img.src = url;
}
imgDrop.addEventListener('click', e => {
  if(e.target.classList.contains('rm')){ setDlgImg(null); return; }
  imgFileInput.click();
});
imgFileInput.addEventListener('change', () => { importImageFile(imgFileInput.files[0]); imgFileInput.value = ''; });
imgDrop.addEventListener('dragover', e => e.preventDefault());
imgDrop.addEventListener('drop', e => { e.preventDefault(); importImageFile(e.dataTransfer.files[0]); });
dlgPart.addEventListener('paste', e => {
  const item = [...e.clipboardData.items].find(i => i.type.startsWith('image/'));
  if(item) importImageFile(item.getAsFile());
});

function openPartDialog(id){
  editPartId = id;
  const p = id != null ? partById(id) : null;
  document.getElementById('dlgPartTitle').textContent = p ? '파츠 수정' : '파츠 추가';
  document.getElementById('pName').value  = p ? p.name : '';
  document.getElementById('pColor').value = p ? p.color : PRESETS[state.parts.length % PRESETS.length];
  document.getElementById('pPrefab').checked = p ? !!p.prefab : true;
  document.getElementById('pMemo').value  = p ? (p.memo||'') : '';
  document.getElementById('pPrompt').value = p ? (p.prompt||'') : '';
  setDlgImg(p ? (p.img||null) : null);
  document.getElementById('pDelete').style.display = p ? '' : 'none';
  dlgPart.showModal();
  document.getElementById('pName').focus();
}
document.getElementById('btnAddPart').addEventListener('click', () => openPartDialog(null));
document.getElementById('pCancel').addEventListener('click', () => dlgPart.close());
document.getElementById('pOk').addEventListener('click', () => {
  const name = document.getElementById('pName').value.trim();
  if(!name){ document.getElementById('pName').focus(); return; }
  pushUndo();
  const vals = {
    name,
    color: document.getElementById('pColor').value,
    prefab: document.getElementById('pPrefab').checked,
    memo: document.getElementById('pMemo').value.trim(),
    prompt: document.getElementById('pPrompt').value.trim(),
    img: dlgImg,
  };
  if(editPartId != null){
    Object.assign(partById(editPartId), vals);
  }else{
    const p = { id: state.partSeq++, ...vals };
    state.parts.push(p);
    activePartId = p.id;
  }
  dlgPart.close();
  renderAll(); markDirty();
});
function deletePart(id){
  const p = partById(id);
  if(!p) return;
  if(!confirm(`파츠 "${p.name}"을(를) 삭제할까요? 배치된 셀도 함께 지워집니다.`)) return false;
  pushUndo();
  state.parts = state.parts.filter(q => q.id !== id);
  for(const s of state.sheets)
    for(let i=0; i<s.cells.length; i++)
      if(s.cells[i] === id) s.cells[i] = 0;
  if(activePartId === id) activePartId = 0;
  renderAll(); markDirty();
  return true;
}
document.getElementById('pDelete').addEventListener('click', () => {
  if(deletePart(editPartId)) dlgPart.close();
});

/* ───────────────────────── 시트 다이얼로그 ───────────────────────── */
const dlgSheet = document.getElementById('dlgSheet');
let editSheetIdx = null;

function updateSizeHint(){
  const w = +document.getElementById('sW').value || 0;
  const h = +document.getElementById('sH').value || 0;
  document.getElementById('sSizeHint').textContent =
    `실제 크기: ${fmt(w*state.cellMeters)}m × ${fmt(h*state.cellMeters)}m`;
}
document.getElementById('sW').addEventListener('input', updateSizeHint);
document.getElementById('sH').addEventListener('input', updateSizeHint);

function openSheetDialog(idx){
  editSheetIdx = idx;
  const s = idx != null ? state.sheets[idx] : null;
  document.getElementById('dlgSheetTitle').textContent = s ? '시트 수정' : '시트 추가';
  document.getElementById('sName').value = s ? s.name : suggestSheetName();
  document.getElementById('sW').value = s ? s.w : (state.sheets[0]?.w || 30);
  document.getElementById('sH').value = s ? s.h : (state.sheets[0]?.h || 20);
  document.getElementById('sDelete').style.display = (s && state.sheets.length > 1) ? '' : 'none';
  updateSizeHint();
  dlgSheet.showModal();
  document.getElementById('sName').focus();
}
function suggestSheetName(){
  const n = state.sheets.filter(s => /층$/.test(s.name)).length;
  return (n+1) + '층';
}
document.getElementById('btnAddSheet').addEventListener('click', () => openSheetDialog(null));
document.getElementById('sCancel').addEventListener('click', () => dlgSheet.close());
document.getElementById('sOk').addEventListener('click', () => {
  const name = document.getElementById('sName').value.trim() || '시트';
  const w = Math.max(1, Math.min(200, +document.getElementById('sW').value || 30));
  const h = Math.max(1, Math.min(200, +document.getElementById('sH').value || 20));
  pushUndo();
  if(editSheetIdx != null){
    const s = state.sheets[editSheetIdx];
    if(w !== s.w || h !== s.h){
      // 기존 내용 유지하며 리사이즈 (좌상단 기준)
      const cells = new Array(w*h).fill(0);
      for(let y=0; y<Math.min(h, s.h); y++)
        for(let x=0; x<Math.min(w, s.w); x++)
          cells[y*w + x] = s.cells[y*s.w + x];
      s.cells = cells; s.w = w; s.h = h;
    }
    s.name = name;
  }else{
    state.sheets.push(mkSheet(name, w, h));
    state.activeSheet = state.sheets.length - 1;
  }
  dlgSheet.close();
  renderAll(); markDirty();
});
document.getElementById('sDelete').addEventListener('click', () => {
  if(!confirm('이 시트를 삭제할까요?')) return;
  pushUndo();
  state.sheets.splice(editSheetIdx, 1);
  state.activeSheet = Math.max(0, state.activeSheet - (state.activeSheet >= editSheetIdx ? 1 : 0));
  dlgSheet.close();
  renderAll(); markDirty();
});

/* ───────────────────────── 내보내기 ───────────────────────── */
function download(name, url){
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
}
document.getElementById('btnExportJson').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(state, null, 1)], {type:'application/json'});
  download((state.name || 'map') + '.mapplan.json', URL.createObjectURL(blob));
});
// 바르코 핸드오프: 공정 파츠의 이미지·메모·프롬프트 + 시트별 사용 칸수를 모은 JSON.
// 이 파일을 클로드 코드에 주면 → 파츠별 VARCO 프롬프트 생성 → 3D 에셋 생성 실행까지 자동화.
document.getElementById('btnExportVarco').addEventListener('click', () => {
  const usage = {};
  for(const s of state.sheets){
    for(const id of s.cells){
      if(!id) continue;
      (usage[id] = usage[id] || {})[s.name] = (usage[id][s.name] || 0) + 1;
    }
  }
  const handoff = {
    type: 'varco-handoff',
    map: state.name,
    cellMeters: state.cellMeters,
    exportedAt: new Date().toISOString(),
    parts: state.parts.map(p => ({
      id: p.id, name: p.name, prefab: !!p.prefab,
      memo: p.memo || '', prompt: p.prompt || '',
      usage: usage[p.id] || {},
      referenceImage: p.img || null,
    })),
  };
  const blob = new Blob([JSON.stringify(handoff, null, 1)], {type:'application/json'});
  download((state.name || 'map') + '.varco.json', URL.createObjectURL(blob));
});
document.getElementById('btnImportJson').addEventListener('click', () =>
  document.getElementById('fileInput').click());
document.getElementById('fileInput').addEventListener('change', async e => {
  const f = e.target.files[0];
  if(!f) return;
  try{
    const st = JSON.parse(await f.text());
    if(!st.sheets || !st.parts) throw new Error('형식이 다릅니다');
    pushUndo();
    state = st;
    afterStateSwap();
  }catch(err){ alert('불러오기 실패: ' + err.message); }
  e.target.value = '';
});

// PNG: 시트 도면 + 하단 범례(파츠 표)
function exportSheetPng(sheetIdx){
  const s = state.sheets[sheetIdx];
  const px = 28, margin = 34;
  const counts = {};
  for(const id of s.cells) if(id) counts[id] = (counts[id]||0) + 1;
  const usedParts = state.parts.filter(p => counts[p.id]);

  const gridW = margin + s.w*px + 1;
  const titleH = 46;
  const rowH = 24, legendPad = 14;
  const legendH = usedParts.length ? legendPad + 26 + usedParts.length*rowH + 10 : 0;
  const W = Math.max(gridW + 20, 560);
  const H = titleH + (margin + s.h*px + 1) + legendH + 16;

  const off = document.createElement('canvas');
  off.width = W * 2; off.height = H * 2;          // 2배 해상도
  const g = off.getContext('2d');
  g.scale(2, 2);
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, W, H);

  // 제목
  g.fillStyle = '#1a1a1a';
  g.font = 'bold 17px "Segoe UI","Malgun Gothic",sans-serif';
  g.textAlign = 'left'; g.textBaseline = 'top';
  const title = (state.name ? state.name + ' — ' : '') + s.name;
  g.fillText(title, 14, 12);
  g.font = '12px "Segoe UI",sans-serif'; g.fillStyle = '#666';
  g.fillText(`${s.w}×${s.h}칸 · 1칸=${state.cellMeters}m · ${fmt(s.w*state.cellMeters)}m×${fmt(s.h*state.cellMeters)}m`, 14, 32);

  // 도면
  g.save(); g.translate(10, titleH);
  drawSheet(g, s, px, margin, false);
  g.restore();

  // 범례
  if(usedParts.length){
    let ly = titleH + margin + s.h*px + 1 + legendPad;
    g.fillStyle = '#1a1a1a'; g.font = 'bold 13px "Segoe UI",sans-serif';
    g.fillText('파츠 리스트', 14, ly);
    ly += 22;
    g.font = '12px "Segoe UI","Malgun Gothic",sans-serif';
    for(const p of usedParts){
      g.fillStyle = p.color;
      g.fillRect(16, ly+3, 14, 14);
      g.strokeStyle = 'rgba(0,0,0,.3)'; g.strokeRect(16.5, ly+3.5, 13, 13);
      g.fillStyle = '#1a1a1a';
      const label = p.name + (p.prefab ? ' ★공정' : '') + ' — ' + counts[p.id] + '칸'
        + (p.memo ? '  (' + p.memo + ')' : '');
      g.fillText(label, 38, ly + 5);
      ly += rowH;
    }
  }
  return off;
}
document.getElementById('btnExportPng').addEventListener('click', () => {
  const off = exportSheetPng(state.activeSheet);
  const nm = (state.name || 'map') + '_' + curSheet().name + '.png';
  download(nm.replace(/[\\/:*?"<>| ]/g, '_'), off.toDataURL('image/png'));
});
document.getElementById('btnExportAllPng').addEventListener('click', () => {
  state.sheets.forEach((s, i) => {
    const off = exportSheetPng(i);
    const nm = (state.name || 'map') + '_' + s.name + '.png';
    setTimeout(() => download(nm.replace(/[\\/:*?"<>| ]/g, '_'), off.toDataURL('image/png')), i*250);
  });
});

/* ───────────────────────── 기타 UI ───────────────────────── */
document.getElementById('projName').addEventListener('input', e => {
  state.name = e.target.value; markDirty();
});
document.getElementById('cellMeters').addEventListener('input', e => {
  state.cellMeters = +e.target.value || 1; renderCanvas(); markDirty();
});
document.getElementById('zoom').addEventListener('input', e => {
  cellPx = +e.target.value; renderCanvas();
});
document.getElementById('btnUndo').addEventListener('click', undo);
document.getElementById('btnRedo').addEventListener('click', redo);

document.addEventListener('keydown', e => {
  if(e.target.tagName === 'INPUT' || document.querySelector('dialog[open]')) return;
  if(e.ctrlKey && e.key.toLowerCase() === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if(e.ctrlKey && e.key.toLowerCase() === 'y'){ e.preventDefault(); redo(); return; }
  const toolKeys = { b:'pen', r:'rect', g:'fill', l:'line', i:'pick', e:null };
  const k = e.key.toLowerCase();
  if(k === 'e'){ activePartId = 0; renderPartList(); return; }
  if(k in toolKeys && toolKeys[k]){ tool = toolKeys[k]; renderTools(); return; }
  const n = parseInt(e.key);
  if(n >= 1 && n <= 9 && state.parts[n-1]){
    activePartId = state.parts[n-1].id; renderPartList();
  }
});

// 캔버스 위 Ctrl+휠 = 줌
document.getElementById('canvasScroll').addEventListener('wheel', e => {
  if(!e.ctrlKey) return;
  e.preventDefault();
  cellPx = Math.max(8, Math.min(48, cellPx + (e.deltaY < 0 ? 2 : -2)));
  document.getElementById('zoom').value = cellPx;
  renderCanvas();
}, {passive:false});

/* ───────────────────────── 시작 ───────────────────────── */
function renderAll(){
  document.getElementById('projName').value = state.name || '';
  document.getElementById('cellMeters').value = state.cellMeters;
  renderSidebar(); renderCanvas();
}
load();
renderAll();
</script>
