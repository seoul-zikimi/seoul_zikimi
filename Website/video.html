<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영상 · 스크린샷 — 건축 레인저: 서울</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="site.css">
</head>
<body data-page="video">

<header class="page-hero">
  <div class="wrap">
    <span class="eyebrow">Media</span>
    <h1>영상 · 스크린샷</h1>
    <p>시연 영상은 새로 촬영 중입니다. 그동안 실제 플레이 장면을 먼저 보세요.</p>
  </div>
</header>

<section class="dark" style="padding-top:0">
  <div class="wrap">
    <div class="frame" style="margin-top:-8px">
      <!-- 시연 영상 준비되면: assets/trailer.mp4 로 넣고 아래 <source> 주석을 풀고 .play / .soon 두 div를 지우세요 -->
      <video poster="assets/play_gwang_hud.jpg" controls preload="none" playsinline>
        <!-- <source src="assets/trailer.mp4" type="video/mp4"> -->
      </video>
      <div class="play"><span>▶</span></div>
      <div class="soon">TRAILER · COMING SOON</div>
    </div>
  </div>
</section>

<section>
  <div class="wrap">
    <div class="sec-head rv">
      <span class="eyebrow">In-Game</span>
      <h2>현장은 이렇게 생겼다</h2>
    </div>
    <div class="mosaic rv">
      <figure class="shot s-a"><img src="assets/play_namsan_phone.jpg" alt="남산타워 현장에서 휴대폰으로 재료 주문"><figcaption class="lbl">남산타워 현장, 휴대폰으로 재료 주문<small>NAMSAN · ORDER</small></figcaption></figure>
      <figure class="shot s-2"><img src="assets/play_gwang_top.jpg" alt="광통교 부감"><figcaption class="lbl">광통교, 돌다리를 쌓는 중<small>GWANGTONGGYO</small></figcaption></figure>
      <figure class="shot s-2"><img src="assets/play_namsan_city.jpg" alt="남산에서 본 서울"><figcaption class="lbl">남산에서 내려다본 서울<small>NAMSAN · VIEW</small></figcaption></figure>
      <figure class="shot s-2"><img src="assets/play_namsan_heart.jpg" alt="전망대 하트 앞" style="object-position:left"><figcaption class="lbl">전망대 층, 하트 앞 공사<small>NAMSAN · DECK</small></figcaption></figure>
      <figure class="shot s-2"><img src="assets/play_gwang_hud.jpg" alt="정답 도면과 주문 UI"><figcaption class="lbl">정답 도면 · 배송 구역 · 주문 폰<small>HUD</small></figcaption></figure>
      <figure class="shot s-2"><img src="assets/play_snow.jpg" alt="눈 내리는 남산"><figcaption class="lbl">눈 내리는 날의 공사<small>WINTER · SNOW</small></figcaption></figure>
    </div>
  </div>
</section>

<section style="background:var(--cream-2);padding-top:0">
  <div class="wrap">
    <div class="sec-head rv" style="padding-top:88px">
      <span class="eyebrow">Seasons</span>
      <h2>같은 현장, 다른 계절</h2>
    </div>
    <div class="seasons rv">
      <figure class="season"><img src="assets/play_spring.jpg" alt="봄"><img class="ic" src="assets/w_CherryBlossom.png" alt=""><figcaption class="lbl">봄<small>벚꽃 · 화창함 · 비</small></figcaption></figure>
      <figure class="season"><img src="assets/play_gwang_top.jpg" alt="여름"><img class="ic" src="assets/w_Typhoon.png" alt=""><figcaption class="lbl">여름<small>화창함 · 비 · 태풍</small></figcaption></figure>
      <figure class="season"><img src="assets/play_autumn.jpg" alt="가을"><img class="ic" src="assets/w_AutumnLeaves.png" alt=""><figcaption class="lbl">가을<small>단풍 · 화창함 · 비</small></figcaption></figure>
      <figure class="season"><img src="assets/play_winter.jpg" alt="겨울"><img class="ic" src="assets/w_Snow.png" alt=""><figcaption class="lbl">겨울<small>눈 · 강풍 · 화창함</small></figcaption></figure>
    </div>
  </div>
</section>

<section class="mypage">
  <div class="wrap">
    <div class="sec-head rv">
      <span class="eyebrow">Lobby &amp; My Page</span>
      <h2>방 만들고, 친구 부르고, 출근</h2>
    </div>
    <div class="grid rv">
      <img src="assets/ui_session.jpg" alt="세션 대기방">
      <div class="col"><img src="assets/ui_room.jpg" alt="방 리스트"><img src="assets/ui_create.jpg" alt="방 생성"></div>
    </div>
    <div class="grid rv" style="margin-top:16px">
      <img src="assets/ui_closet.jpg" alt="옷장">
      <div class="col"><img src="assets/ui_record.jpg" alt="기록책"><img src="assets/ui_freemode.jpg" alt="자유 모드 스크랩북"></div>
    </div>
  </div>
</section>

<section class="story" style="background:var(--cream-2)">
  <div class="wrap">
    <div class="sec-head rv">
      <span class="eyebrow">Intro Cutscene</span>
      <h2>인트로 컷씬</h2>
    </div>
    <div class="strip six">
      <article class="panel rv" style="--tilt:-1.2deg"><div class="img"><img src="assets/intro1.jpg" alt="재난"></div><div class="txt"><h3>서울이 무너졌다</h3></div></article>
      <article class="panel rv" style="--tilt:1deg"><div class="img"><img src="assets/intro2.jpg" alt="공고"></div><div class="txt"><h3>긴급 인력 모집</h3></div></article>
      <article class="panel rv" style="--tilt:-0.8deg"><div class="img"><img src="assets/intro3.jpg" alt="등껍질"></div><div class="txt"><h3>어? 우리 등껍질 있는데?</h3></div></article>
      <article class="panel rv" style="--tilt:1.3deg"><div class="img"><img src="assets/intro4.jpg" alt="결성"></div><div class="txt"><h3>우리가 서울을 다시 세운다!</h3></div></article>
      <article class="panel rv" style="--tilt:-1deg"><div class="img"><img src="assets/intro5.jpg" alt="건축레인저"></div><div class="txt"><h3>자칭 히어로, 건축레인저!</h3></div></article>
      <article class="panel rv" style="--tilt:0.9deg"><div class="img"><img src="assets/intro6.jpg" alt="노동"></div><div class="txt"><h3>…히어로도 땀은 흘려야 한다</h3></div></article>
    </div>
  </div>
</section>

<script src="site.js"></script>
</body>
</html>
